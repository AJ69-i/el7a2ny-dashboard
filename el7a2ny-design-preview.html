  function go(p){

  function tableHtml(s){

        return '<button class="fp'+(k==='all'?' on':'')+'" style="--pcl:'+c+'" data-s="'+k+'" onclick="setStatus(\''+k+'\',this)">'+(k==='all'?'All':(ST[k]?ST[k].l:k))+'<span class="pc">'+n+'</span></button>';
      }).join('')+'</div>';
    }
    return '<section class="page on">'+
      '<div class="card filters"><div class="frow">'+
        '<label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input placeholder="Search…" oninput="onSearch(this.value)"/></label>'+

        '<tbody id="tb"></tbody></table></div></section>';

  function renderRows(){
    var s=SECTIONS[cur];if(!s||s.type!=='table')return;
    var rows=s.rows.filter(function(r){
      if(s.status&&curStatus!=='all'&&r.status!==curStatus)return false;
      if(curQuery){var hay=Object.values(r).join(' ').toLowerCase();if(hay.indexOf(curQuery)<0)return false}
      return true;
    });
    document.getElementById('tb').innerHTML=rows.map(function(r,i){
      var idx=s.rows.indexOf(r);
      return '<tr onclick="openDrawer('+idx+')">'+s.cols.map(function(c){return '<td data-l="'+COLS[c].l+'">'+COLS[c].r(r)+'</td>'}).join('')+
        '<td data-l="" style="text-align:right"><button class="rowbtn" onclick="event.stopPropagation()">'+s.action+'</button></td></tr>';
    }).join('')||'<tr><td style="padding:36px;text-align:center;color:var(--t-mut)">No records match.</td></tr>';
    var c=document.getElementById('cnt');if(c)c.textContent=rows.length;
  }

  function kpi(ac,v,l,ic){return '<div class="card kpi" style="--ac:'+ac+'"><div class="ic"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ic+'</svg></div><div class="v">'+v+'</div><div class="l">'+l+'</div></div>'}
  function kpiBar(ac,v,l,ic,p){return '<div class="card kpi" style="--ac:'+ac+'"><div class="ic"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ic+'</svg></div><div class="v">'+v+'</div><div class="l">'+l+'</div><div class="bar"><i style="width:'+p+'%"></i></div></div>'}
  function bar(l,w,v){return '<li><span class="lb">'+l+'</span><span class="tk"><span class="fl" style="width:'+w+'%"></span></span><span class="vl">'+v+'</span></li>'}

  function showLogin(){document.getElementById('login').classList.add('on')}
  function hideLogin(){document.getElementById('login').classList.remove('on')}

  buildNav();
  go('dashboard');
</script>
</body>
</html>
